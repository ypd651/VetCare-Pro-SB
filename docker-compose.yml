services:
  veterinaria-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetcare-pro
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/veterinariadb
      APP_SEED_ENABLED: "true"
    volumes:
      - veterinaria_data:/app/data
    restart: unless-stopped

volumes:
  veterinaria_data:
