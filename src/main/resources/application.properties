spring.application.name=veterinaria
server.port=${PORT:8080}

# Base de datos H2 persistente en archivo local (configurable via variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/veterinariadb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Serializacion JSON legible para fechas
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Semilla inicial de datos de demostracion (desactivable con app.seed.enabled=false)
app.seed.enabled=${APP_SEED_ENABLED:true}
